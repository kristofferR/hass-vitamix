cancel:
  name: Cancel program
  description: >-
    Unload the current program, like the official Vitamix app. Refused
    while the motor runs, and on C-panels with Thread firmware 1.4.
  target:
    device:
      integration: vitamix

upload_program:
  name: Upload program
  description: >-
    Upload a custom program of up to four steps, encoded like the official
    app and checked against the attached container. The blender then waits
    for you to press start (B-panels: turn the dial to 1 first).
  target:
    device:
      integration: vitamix
  fields:
    steps:
      name: Steps
      description: >-
        List of steps. power is 0-100 % (50 % is about 4500 RPM), seconds
        is whole seconds, ramp is the optional ramp-up time in seconds.
        Steps over 240 s count as several of the four segments.
      required: true
      example: |
        - power: 30
          seconds: 10
        - power: 80
          seconds: 40
          ramp: 2
      selector:
        object:
    container_id:
      name: Container id
      description: >-
        Override the detected container (1 = 64 oz, 2 = personal cup,
        3 = 48 oz wet, 4 = 48 oz dry). Required on old B-panels.
      required: false
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: box

load_program:
  name: Load saved program (experimental)
  description: >-
    Experimental. Writes a slot number to the legacy recipe register. The
    official app treats that register as a recipe state, not a program
    slot. Enable experimental motor control in the integration options.
  target:
    device:
      integration: vitamix
  fields:
    slot:
      name: Program slot
      description: 1-indexed saved-program slot (1 = first preset).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          step: 1
          mode: box

set_motor_speed:
  name: Set motor speed (experimental)
  description: >-
    Experimental and unverified: the official app has no remote speed
    control. Stages a legacy 1-step program at dial speed 0..10.
  target:
    device:
      integration: vitamix
  fields:
    speed:
      name: Speed
      description: >-
        0..10 on the variable-speed dial. 0 calls stop_motor; 10 is
        full speed.
      required: true
      example: 5
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: slider
    duration:
      name: Duration (seconds)
      description: >-
        How long the motor should run before the firmware times it
        out. Defaults to 65535 (~18h, used as "run forever" sentinel).
      required: false
      default: 65535
      example: 60
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box

start_motor:
  name: Start motor (experimental)
  description: >-
    Experimental and unverified: the official app has no remote start.
    Wrapper around set_motor_speed, defaulting to dial speed 5.
  target:
    device:
      integration: vitamix
  fields:
    speed:
      name: Speed
      description: 1..10 on the variable-speed dial.
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider
    duration:
      name: Duration (seconds)
      required: false
      default: 65535
      example: 60
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box

stop_motor:
  name: Stop motor (experimental)
  description: >-
    Experimental: writes 0 to the legacy recipe register even while the
    motor runs, which the official app never does. Not a safety stop.
  target:
    device:
      integration: vitamix

play_melody:
  name: Play melody (experimental)
  description: >-
    Experimental and unverified.
    Play a sequence of (speed, duration) "notes" by re-staging a
    1-step custom program for each note and sleeping for its dwell
    time. Holds a single BLE connection open for the whole tune.
  target:
    device:
      integration: vitamix
  fields:
    notes:
      name: Notes
      description: >-
        List of {speed, duration} pairs. Speed is 0..10 (0 = silence /
        stop), duration is in seconds (fractions allowed).
      required: true
      example: |
        - speed: 4
          duration: 0.3
        - speed: 8
          duration: 0.6
      selector:
        object:
    gap:
      name: Gap between notes (seconds)
      description: >-
        Optional silence inserted between notes (motor stops). Set to
        0 for back-to-back notes.
      required: false
      default: 0.0
      example: 0.05
      selector:
        number:
          min: 0
          max: 5
          step: 0.05
          mode: box
